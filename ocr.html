<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rasmdan matn o'qish (OCR)</title>
<style>
  :root {
    --bg: #f5f6f4; --card: #ffffff; --ink: #1d2320; --muted: #66706a;
    --line: #d9ded9; --accent: #1f6f54; --accent-ink: #ffffff; --bar: #e3e8e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a17; --card: #1d2420; --ink: #e8ede9; --muted: #96a09a;
      --line: #2f3a34; --accent: #4fb88f; --accent-ink: #0d1612; --bar: #2a342e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 56px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; color: var(--muted); }
  .drop {
    display: block; border: 2px dashed var(--line); border-radius: 12px;
    background: var(--card); padding: 28px 16px; text-align: center; cursor: pointer;
  }
  .drop:hover, .drop.over, .drop:focus-within { border-color: var(--accent); }
  .drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .drop strong { display: block; margin-bottom: 4px; }
  .drop span { color: var(--muted); font-size: .9rem; }
  img#preview { display: none; max-width: 100%; max-height: 320px; margin: 16px auto 0; border-radius: 8px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin: 20px 0; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; color: var(--muted); }
  select, button, textarea {
    font: inherit; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px;
  }
  select { padding: 9px 10px; }
  button { padding: 10px 18px; cursor: pointer; }
  button.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .progress { display: none; margin: 8px 0 20px; }
  .progress .bar { height: 8px; border-radius: 4px; background: var(--bar); overflow: hidden; }
  .progress .fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .progress p { margin: 6px 0 0; font-size: .9rem; color: var(--muted); }
  textarea { width: 100%; min-height: 220px; padding: 12px; resize: vertical; }
  .result-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .result-head h2 { font-size: 1.1rem; margin: 0; }
  .meta { color: var(--muted); font-size: .85rem; margin-top: 6px; }
  .err { color: #c0392b; margin: 8px 0; }
</style>
</head>
<body>
<main>
  <h1>Rasmdan matn o'qish</h1>
  <p class="sub">Rasm tanlang, tilni belgilang va "Matnni o'qish" tugmasini bosing. Hammasi brauzeringizda ishlaydi.</p>

  <label class="drop" id="drop">
    <input type="file" id="fayl" accept="image/*">
    <strong>Rasmni shu yerga tashlang yoki bosib tanlang</strong>
    <span>Rasmni Ctrl+V bilan qo'yish ham mumkin (PNG, JPG, WEBP)</span>
    <img id="preview" alt="Tanlangan rasm">
  </label>

  <div class="row">
    <label class="f">Rasmdagi til
      <select id="til">
        <option value="uzb">O'zbek (lotin)</option>
        <option value="uzb_cyrl">O'zbek (kirill)</option>
        <option value="rus">Rus</option>
        <option value="eng">Ingliz</option>
        <option value="uzb+eng">O'zbek + Ingliz</option>
        <option value="rus+eng">Rus + Ingliz</option>
      </select>
    </label>
    <label class="f">Tarjima tili
      <select id="maqsad">
        <option value="uz">O'zbek</option>
        <option value="ru">Rus</option>
        <option value="en">Ingliz</option>
      </select>
    </label>
    <label class="f" style="flex-direction:row;align-items:center;gap:8px;padding-bottom:10px;color:var(--ink)">
      <input type="checkbox" id="kulrang" checked style="width:18px;height:18px;accent-color:var(--accent)">
      Kulrang holatga o'tkazish
    </label>
    <button id="qoyish" type="button">Buferdan qo'yish</button>
    <button class="main" id="boshlash" disabled>Matnni o'qish</button>
  </div>

  <div class="progress" id="progress">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <p id="holat">Tayyorlanmoqda...</p>
  </div>
  <div class="err" id="xato" role="alert"></div>

  <div class="result-head">
    <h2>Natija</h2>
    <button id="nusxa" disabled>Nusxalash</button>
  </div>
  <textarea id="natija" placeholder="O'qilgan matn shu yerda chiqadi. Xatolarni qo'lda tuzatishingiz mumkin."></textarea>
  <div class="meta" id="meta"></div>

  <div class="result-head" style="margin-top:28px">
    <h2>Tarjima</h2>
    <div style="display:flex;gap:8px">
      <button class="main" id="tarjima" disabled>Tarjima qilish</button>
      <button id="nusxa2" disabled>Nusxalash</button>
    </div>
  </div>
  <textarea id="tarjimaNatija" readonly placeholder="Tarjima shu yerda chiqadi. Tarjima tilini yuqoridan tanlang."></textarea>
  <div class="err" id="xato2" role="alert"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let tanlangan = null;

  function rasmniQoyish(file) {
    if (!file || !file.type.startsWith('image/')) {
      $('xato').textContent = "Iltimos, rasm faylini tanlang.";
      return;
    }
    $('xato').textContent = '';
    tanlangan = file;
    const url = URL.createObjectURL(file);
    const img = $('preview');
    img.src = url;
    img.style.display = 'block';
    kulrangPreview();
    $('boshlash').disabled = false;
  }

  $('fayl').addEventListener('change', (e) => rasmniQoyish(e.target.files[0]));

  const drop = $('drop');
  ['dragenter', 'dragover'].forEach(n => drop.addEventListener(n, (e) => {
    e.preventDefault(); drop.classList.add('over');
  }));
  ['dragleave', 'drop'].forEach(n => drop.addEventListener(n, (e) => {
    e.preventDefault(); drop.classList.remove('over');
  }));
  drop.addEventListener('drop', (e) => rasmniQoyish(e.dataTransfer.files[0]));

  document.addEventListener('paste', (e) => {
    const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
    if (item) rasmniQoyish(item.getAsFile());
  });

  $('qoyish').addEventListener('click', async () => {
    $('xato').textContent = '';
    try {
      const items = await navigator.clipboard.read();
      for (const item of items) {
        const tur = item.types.find(t => t.startsWith('image/'));
        if (tur) {
          const blob = await item.getType(tur);
          rasmniQoyish(new File([blob], 'bufer.png', { type: tur }));
          return;
        }
      }
      $('xato').textContent = "Buferda rasm yo'q. Avval rasmni nusxalang (Copy Image yoki skrinshot).";
    } catch (err) {
      $('xato').textContent = "Bufer o'qilmadi. Sahifani bosing va Ctrl+V ni sinab ko'ring.";
    }
  });

  // ---- Kulrang holatga o'tkazish ----
  function kulrangPreview() {
    $('preview').style.filter = $('kulrang').checked ? 'grayscale(1)' : 'none';
  }
  $('kulrang').addEventListener('change', kulrangPreview);
  $('fayl').addEventListener('change', kulrangPreview);

  function kulrangQilish(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = img.naturalWidth;
        c.height = img.naturalHeight;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const d = ctx.getImageData(0, 0, c.width, c.height);
        const p = d.data;
        for (let i = 0; i < p.length; i += 4) {
          const g = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2];
          p[i] = p[i + 1] = p[i + 2] = g;
        }
        ctx.putImageData(d, 0, 0);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? resolve(b) : reject(new Error("Rasmni kulrangga o'tkazib bo'lmadi")), 'image/png');
      };
      img.onerror = () => reject(new Error("Rasmni o'qib bo'lmadi"));
      img.src = url;
    });
  }

  // ---- Tarjima (MyMemory bepul API) ----
  const tilKodi = { uzb: 'uz', uzb_cyrl: 'uz', rus: 'ru', eng: 'en' };

  $('natija').addEventListener('input', () => {
    $('tarjima').disabled = !$('natija').value.trim();
  });

  function bolaklarga(matn, limit = 450) {
    const qismlar = matn.split(/(?<=[.!?\n])\s*/).filter(s => s.trim());
    const guruh = [];
    let joriy = '';
    for (const q of qismlar) {
      if ((joriy + ' ' + q).length > limit && joriy) { guruh.push(joriy); joriy = q; }
      else joriy = joriy ? joriy + ' ' + q : q;
    }
    if (joriy) guruh.push(joriy);
    // juda uzun bitta gap bo'lsa, majburan kesamiz
    return guruh.flatMap(g => g.match(new RegExp('.{1,' + limit + '}', 'gs')) || []);
  }

  $('tarjima').addEventListener('click', async () => {
    const matn = $('natija').value.trim();
    if (!matn) return;
    const manba = tilKodi[$('til').value.split('+')[0]] || 'en';
    const maqsad = $('maqsad').value;
    $('xato2').textContent = '';
    if (manba === maqsad) {
      $('xato2').textContent = "Rasmdagi til va tarjima tili bir xil. Boshqa tarjima tilini tanlang.";
      return;
    }
    $('tarjima').disabled = true;
    $('tarjima').textContent = 'Tarjima qilinmoqda...';
    $('tarjimaNatija').value = '';
    try {
      const natijalar = [];
      for (const q of bolaklarga(matn)) {
        const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(q) +
                    '&langpair=' + manba + '|' + maqsad;
        const res = await fetch(url);
        const j = await res.json();
        if (j.responseStatus !== 200) throw new Error(j.responseDetails || "Tarjima xizmati javob bermadi");
        natijalar.push(j.responseData.translatedText);
      }
      $('tarjimaNatija').value = natijalar.join('\n');
      $('nusxa2').disabled = false;
    } catch (err) {
      console.error(err);
      $('xato2').textContent = "Tarjima bo'lmadi: " + (err.message || err) + ". Internetni tekshiring yoki birozdan keyin urinib ko'ring.";
    } finally {
      $('tarjima').disabled = false;
      $('tarjima').textContent = 'Tarjima qilish';
    }
  });

  $('nusxa2').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('tarjimaNatija').value); }
    catch { $('tarjimaNatija').select(); document.execCommand('copy'); }
    $('nusxa2').textContent = 'Nusxalandi';
    setTimeout(() => $('nusxa2').textContent = 'Nusxalash', 1500);
  });

  const holatMatni = {
    'loading tesseract core': 'Dvigatel yuklanmoqda...',
    'initializing tesseract': 'Dvigatel ishga tushmoqda...',
    'loading language traineddata': "Til ma'lumotlari yuklanmoqda...",
    'initializing api': 'Tayyorlanmoqda...',
    'recognizing text': "Matn o'qilmoqda..."
  };

  $('boshlash').addEventListener('click', async () => {
    if (!tanlangan) return;
    const t0 = performance.now();
    $('boshlash').disabled = true;
    $('nusxa').disabled = true;
    $('xato').textContent = '';
    $('natija').value = '';
    $('meta').textContent = '';
    $('progress').style.display = 'block';
    $('fill').style.width = '0%';

    let worker;
    try {
      worker = await Tesseract.createWorker($('til').value, 1, {
        logger: (m) => {
          $('holat').textContent = holatMatni[m.status] || m.status;
          $('fill').style.width = Math.round((m.progress || 0) * 100) + '%';
        }
      });
      const manbaRasm = $('kulrang').checked ? await kulrangQilish(tanlangan) : tanlangan;
      const { data } = await worker.recognize(manbaRasm);
      $('natija').value = data.text.trim();
      const sek = ((performance.now() - t0) / 1000).toFixed(1);
      $('meta').textContent = `Aniqlik: ${Math.round(data.confidence)}%  |  Vaqt: ${sek} soniya`;
      $('nusxa').disabled = !data.text.trim();
      $('tarjima').disabled = !data.text.trim();
      $('tarjimaNatija').value = '';
      $('nusxa2').disabled = true;
      $('xato2').textContent = '';
      if (!data.text.trim()) $('xato').textContent = "Rasmdan matn topilmadi. Aniqroq rasm bilan urinib ko'ring.";
    } catch (err) {
      console.error(err);
      $('xato').textContent = "Xatolik: " + (err.message || err) + ". Internet aloqasini tekshiring.";
    } finally {
      if (worker) await worker.terminate();
      $('progress').style.display = 'none';
      $('boshlash').disabled = false;
    }
  });

  $('nusxa').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText($('natija').value);
      $('nusxa').textContent = 'Nusxalandi';
    } catch {
      $('natija').select();
      document.execCommand('copy');
      $('nusxa').textContent = 'Nusxalandi';
    }
    setTimeout(() => $('nusxa').textContent = 'Nusxalash', 1500);
  });
</script>
</body>
</html>
